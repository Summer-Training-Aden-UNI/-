  <path d="M 174 205 Q 200 213 226 205 Q 200 198 174 205 Z" fill="#202020"/>
  <path d="M 183 216 Q 200 224 217 216" fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round"/>

  <!-- Badge at bottom -->
  <rect x="110" y="355" width="180" height="32" rx="16" fill="#1565c0" stroke="url(#gold6)" stroke-width="1.5"/>
  <text x="200" y="376" font-family="'Tajawal', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">عضو اللجنة الرقابية</text>
