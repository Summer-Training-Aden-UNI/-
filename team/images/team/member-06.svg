<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="50%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
    <linearGradient id="gold6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <radialGradient id="glow6" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg6)"/>
  <circle cx="200" cy="180" r="160" fill="url(#glow6)"/>

  <circle cx="200" cy="180" r="150" fill="none" stroke="url(#gold6)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,6"/>
  <circle cx="200" cy="180" r="135" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Body Jacket -->
  <path d="M 100 400 C 100 310, 140 270, 200 270 C 260 270, 300 310, 300 400 Z" fill="#0b386f"/>
  <path d="M 170 270 L 200 340 L 230 270 Z" fill="#ffffff"/>
  <path d="M 193 285 L 207 285 L 203 360 L 197 360 Z" fill="#0288d1"/>

  <path d="M 125 400 L 175 270 L 200 310 L 170 400 Z" fill="#114b91"/>
  <path d="M 275 400 L 225 270 L 200 310 L 230 400 Z" fill="#114b91"/>

  <!-- Neck -->
  <rect x="182" y="225" width="36" height="50" rx="10" fill="#dca37d"/>

  <!-- Head -->
  <ellipse cx="200" cy="185" rx="52" ry="62" fill="#eab38f"/>

  <ellipse cx="146" cy="185" rx="10" ry="16" fill="#dca37d"/>
  <ellipse cx="254" cy="185" rx="10" ry="16" fill="#dca37d"/>

  <!-- Modern Hair Style -->
  <path d="M 145 170 C 142 120, 258 120, 255 170 C 255 125, 145 125, 145 170 Z" fill="#202020"/>

  <!-- Eyebrows & Eyes -->
  <path d="M 165 168 Q 178 163 188 168" fill="none" stroke="#202020" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 212 168 Q 222 163 235 168" fill="none" stroke="#202020" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="177" cy="180" r="5" fill="#202020"/>
  <circle cx="223" cy="180" r="5" fill="#202020"/>

