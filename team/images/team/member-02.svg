  <rect x="110" y="355" width="180" height="32" rx="16" fill="#0d47a1" stroke="url(#gold2)" stroke-width="1.5"/>
  <text x="200" y="376" font-family="'Tajawal', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">نائب رئيس الهيئة</text>
