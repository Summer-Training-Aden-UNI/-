  <path d="M 212 168 Q 222 163 235 168" fill="none" stroke="#1c1c1c" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="177" cy="180" r="5" fill="#1c1c1c"/>
  <circle cx="223" cy="180" r="5" fill="#1c1c1c"/>

