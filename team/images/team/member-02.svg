  <path d="M 100 400 C 100 310, 140 270, 200 270 C 260 270, 300 310, 300 400 Z" fill="#0f2b48"/>
  <path d="M 170 270 L 200 340 L 230 270 Z" fill="#ffffff"/>
  <path d="M 193 285 L 207 285 L 203 360 L 197 360 Z" fill="#1565c0"/>

  <path d="M 125 400 L 175 270 L 200 310 L 170 400 Z" fill="#183b63"/>
  <path d="M 275 400 L 225 270 L 200 310 L 230 400 Z" fill="#183b63"/>

  <!-- Neck -->
  <rect x="182" y="225" width="36" height="50" rx="10" fill="#dca682"/>

  <!-- Head -->
  <ellipse cx="200" cy="185" rx="52" ry="62" fill="#eab795"/>

  <ellipse cx="146" cy="185" rx="10" ry="16" fill="#dca682"/>
  <ellipse cx="254" cy="185" rx="10" ry="16" fill="#dca682"/>

  <!-- Hair -->
  <path d="M 146 175 C 145 130, 160 115, 200 115 C 240 115, 255 130, 254 175 C 245 140, 155 140, 146 175 Z" fill="#1c1c1c"/>

