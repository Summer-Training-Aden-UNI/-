<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#0d3b11"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg1)"/>
  <circle cx="200" cy="180" r="160" fill="url(#glow)"/>

  <!-- Decorative Pattern Lines -->
  <circle cx="200" cy="180" r="150" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,6"/>
  <circle cx="200" cy="180" r="135" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Body / Coat (Traditional Yemeni / Executive Blazer) -->
  <path d="M 100 400 C 100 310, 140 270, 200 270 C 260 270, 300 310, 300 400 Z" fill="#153e18"/>
  <!-- Inner Shirt & Tie -->
  <path d="M 170 270 L 200 340 L 230 270 Z" fill="#ffffff"/>
  <path d="M 193 285 L 207 285 L 204 360 L 196 360 Z" fill="#ffb300"/>

  <!-- Coat Collar -->
  <path d="M 125 400 L 175 270 L 200 310 L 170 400 Z" fill="#255928"/>
  <path d="M 275 400 L 225 270 L 200 310 L 230 400 Z" fill="#255928"/>

  <!-- Neck -->
  <rect x="182" y="225" width="36" height="50" rx="10" fill="#d7a17c"/>

  <!-- Head -->
  <ellipse cx="200" cy="185" rx="52" ry="62" fill="#e5b08c"/>

  <!-- Ears -->
  <ellipse cx="146" cy="185" rx="10" ry="16" fill="#d7a17c"/>
  <ellipse cx="254" cy="185" rx="10" ry="16" fill="#d7a17c"/>

  <!-- Hair & Traditional Turban / Headwear -->
  <path d="M 145 170 C 142 120, 258 120, 255 170 C 255 130, 145 130, 145 170 Z" fill="#2c2c2c"/>
  <path d="M 140 160 C 140 100, 260 100, 260 160 C 270 110, 130 110, 140 160 Z" fill="url(#gold)"/>

  <!-- Eyebrows & Eyes -->
  <path d="M 165 170 Q 178 165 188 170" fill="none" stroke="#2c2c2c" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 212 170 Q 222 165 235 170" fill="none" stroke="#2c2c2c" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="177" cy="182" r="5" fill="#2c2c2c"/>
  <circle cx="223" cy="182" r="5" fill="#2c2c2c"/>

  <!-- Mustache & Beard Accent -->
  <path d="M 172 210 Q 200 220 228 210 Q 200 200 172 210 Z" fill="#2c2c2c"/>
  <path d="M 188 222 Q 200 230 212 222" fill="none" stroke="#2c2c2c" stroke-width="3" stroke-linecap="round"/>

  <!-- Friendly Smile -->
  <path d="M 185 204 Q 200 212 215 204" fill="none" stroke="#aa6c49" stroke-width="2" stroke-linecap="round"/>

  <!-- Glasses -->
  <circle cx="176" cy="182" r="15" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="224" cy="182" r="15" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <line x1="191" y1="182" x2="209" y2="182" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Badge at bottom -->
  <rect x="110" y="355" width="180" height="32" rx="16" fill="#1b5e20" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="200" y="376" font-family="'Tajawal', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">رئيس الهيئة الإدارية</text>
</svg>
